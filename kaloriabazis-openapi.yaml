  /bejelentkezes:
    post:
      summary: Log in (the real form action)
      description: Verified live 2026-10-04 with a test account. Consumes the `myt` CSRF token from `GET
        /` and sets `myPHP83SESSID` on success. Form-urlencoded; `mode=get` is what the real form sends.
        On failure the page re-renders with an error message; a 200 can also mean "already logged in".
      tags:
