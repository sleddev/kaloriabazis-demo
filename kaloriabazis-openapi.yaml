                myt:
                  type: string
                  description: CSRF token from the homepage form.
                txtusern:
                  type: string
                  description: User name / e-mail.
                txtpassw:
                  type: string
                  description: Password.
      responses:
        '200':
          description: Logged-in homepage (HTML). Sets myPHP83SESSID.
