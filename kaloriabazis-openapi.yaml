openapi: 3.1.0
info:
  title: KalóriaBázis (kaloriabazis.hu) — unofficial API specification
  version: 1.0.0 (reverse-engineered 2026-10-03)
  description: "Reverse-engineered REST-ish API of **kaloriabazis.hu** (the most-used Hungarian calorie-counting\n\
    service, ~600k users). The API was mapped by extracting every AJAX call from the site's JavaScript\
    \ bundle\n(func*.js) and by probing the endpoints live.\n\n## How the API works\n\n* One-Endpoint-Many-Actions\
    \ pattern: most logic lives behind `/food.php`, `/food2.php`, `/food_operations.php`,\n  `/vote_ajax.php`,\
    \ `/price_ajax.php` and `/barcode_ajax.php`; each request carries a `show=<action>` parameter\n  that\
    \ selects the handler. Requests are `GET` (jQuery `$.getJSON`/`$.ajax`), never `POST`, and send\n\
    \  `X-Requested-With: XMLHttpRequest`.\n* Search lives in its own endpoint: `/getfood.php`.\n* Chart\
    \ data lives in `/PCC_pie.php`, `/PCC_pie2.php`, `/PCC_weight.php`, `/PCC_weight2.php` (pie/line data\
    \ for the\n  diary graphs), plus `/triplet_build.php` for composed (\"triplet\") foods.\n* `/cardcancel_234786583.php`\
    \ is the obfuscated payment-card-cancel endpoint.\n\n## Session and guard (important)\n\n* Every request\
    \ needs a live PHP session: first visit **any** page (e.g. `https://kaloriabazis.hu/fooldal`) to get\
    \ the\n  `myPHP83SESSID` cookie, then call the endpoints with the same cookie jar. A cold session\
    \ returns the guard.\n* The server checks that requests look like the real frontend: browser `User-Agent`,\
    \ `X-Requested-With: XMLHttpRequest`,\n  and a matching `Referer` (e.g. `https://kaloriabazis.hu/naplo`\
    \ for diary calls). Requests that fail these checks get\n  the body `die_with_text arjrjkrk` (HTTP\
    \ 200, text/plain). This is the site's lightweight anti-scraping guard.\n* Bursting many requests\
    \ from one IP triggers a temporary tarpit: the server accepts the TCP connection but never\n  responds\
    \ (curl sees `HTTP 000` after ~25 s). The lockout lasts on the order of minutes to tens of minutes.\n\
    \  Keep at most a few requests per minute.\n* An **unknown `show` value never returns** (same tarpit\
    \ behaviour) — only enumerate actions listed here.\n* Session-expiry responses: HTML/text pages contain\
    \ `###TIMEOUT###`, JSON responses contain `{\"type\":\"1\"}` with an\n  optional `error` message (the\
    \ client then shows the login dialog).\n* Anonymous access: only a handful of actions work without\
    \ login (search, name/id lookups, unit lists, food datasheet,\n  site statistics, top-300 list, barcode\
    \ lookup, calculations). Everything that mutates diary or user data requires a\n  logged-in session.\n\
    \n## Conventions\n\n* Object id strings look like `\"1147_0\"` — the part before `_` is the food/recipe\
    \ id, after `_` the unit id (`0` =\n  the default unit). `getid` strips the `_0` part for you.\n*\
    \ Diary dates use `YYYY-MM-DD` in AJAX parameters (the website itself shows Hungarian dots format).\n\
    * Meal slots (`tod` / `boxdayoftime`): 0 breakfast, 1 morning snack, 2 lunch, 3 afternoon snack, 4\
    \ dinner, 5 late-night snack.\n* Unit names are returned as translation keys (`UNIT_dkg`, `UNIT_g`,\
    \ `UNIT_kozepes`, ...) that the frontend maps to\n  Hungarian strings.\n* Nutrient property ids (`prop_id`)\
    \ are stable site-wide; see the `NutrientProperty` table in the report.\n* All paths here use `?show=<action>`\
    \ in the path string so every action appears as its own operation; the `show`\n  parameter is fixed\
    \ per path.\n\n\n## Authentication flow (verified 2026-10-04)\n\n1. `GET /` — the homepage. Logged\
    \ out it contains the `#loginForm` with hidden CSRF field `myt`.\n2. `POST /bejelentkezes` — the real\
    \ form action. Form-urlencoded: `mode=get`, `myt` (from step 1), `txtusern`, `txtpassw`. On success\
    \ it sets the `myPHP83SESSID` session cookie and serves the logged-in homepage.\n3. Use the cookie\
    \ on every subsequent call. `GET /login` is NOT the login form any more — it 302-redirects to `/`.\n\
    4. `GET /kijelentkezes` — logout: 302, destroys the session (afterwards the homepage shows the login\
    \ form again and per-user calls return guest-level data).\n\nLegacy notes: `POST /login` with `myuser`/`mypw`/`myt`\
    \ still authenticates, but does not (re)issue the session cookie; do not build on it.\n"
  x-unofficial: true
servers:
- url: https://kaloriabazis.hu
tags:
- name: Search
  description: getfood.php — food and recipe search with paging and nutrient filters.
- name: Diary & calculations
  description: 'food.php actions: logging foods and sports, editing, copying, calculating.'
- name: Food data
  description: 'food2.php actions: nutrient datasheet, top-300 list, categories.'
- name: Community / translation voting
  description: vote_ajax.php — users vote on Hungarian translations of food names.
- name: Prices & bonus points
  description: price_ajax.php — crowd-sourced shop prices and bonus points.
- name: Barcode scanner
  description: barcode_ajax.php — EAN lookup and linking.
- name: Food operations
  description: food_operations.php — bulk food operations, cookie consent, bonus points.
- name: User settings & account
  description: daily limits, nutrient settings, body metrics, account deletion.
- name: Calculators / charts
  description: PCC_*.php — chart data for the diary graphs and the triplet builder.
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: myPHP83SESSID
  schemas:
    SessionStatus:
      type: object
      properties:
        type:
          type: integer
          const: 1
          description: 1 = not logged in / session expired.
        error:
          type: string
          description: Localised error text, e.g. "Nem vagy bejelentkezve!".
    FoodUnit:
      type: object
      properties:
        ID:
          type: integer
        Name:
          type: string
          description: 'Translation key: UNIT_dkg, UNIT_g, UNIT_kozepes, UNIT_darab, UNIT_nagy, UNIT_kiskanal,
            UNIT_unncia, ...'
        nWeight:
          type: number
          description: Unit weight in grams (when the unit is gram-based).
    CalcResult:
      type: object
      properties:
        cal:
          type: number
          description: kcal for the amount.
        feherje:
          type: number
          description: Protein (g) — Hungarian "fehérje".
        szen:
          type: number
          description: Carbohydrate (g) — "szénhidrát".
        zsir:
          type: number
          description: Fat (g) — "zsír".
        weight:
          type: number
          description: Resolved grams (calcfooddetail only).
    DailyFrame:
      type: object
      properties:
        actualfat:
          type: number
        maxfat:
          type: number
        actualprotein:
          type: number
        maxprotein:
          type: number
        actualcarbo:
          type: number
        maxcarbo:
          type: number
    DayEvaluation:
      type: object
      properties:
        nettokal:
          type: number
          description: Net calories of the day (food minus sport).
        nbevitt:
          type: number
          description: Calories ingested.
        napikeretszazalek:
          type: number
          description: '% of the daily frame filled.'
        egyhet:
          type: number
          description: Weekly average kcal.
        egyhonap:
          type: number
          description: Monthly average kcal.
        felev:
          type: number
          description: Half-year average kcal.
        alapjarat:
          type: number
          description: Base metabolism (BMR) kcal.
        negetes:
          type: number
          description: Deficit kcal.
        msg1:
          type: string
        msg2:
          type: string
        msg3:
          type: string
    SumStat:
      type: object
      properties:
        osszfogyas:
          type: integer
          description: Total foods ever logged by all users.
        fogyasztas:
          type: integer
          description: Total logged today.
        aktivtagok:
          type: integer
          description: Active members.
        kereshetoetelek:
          type: integer
          description: Searchable food count.
    PersDays:
      type: object
      properties:
        daynumber:
          type: integer
          description: Diary streak in days.
    BonusPoints:
      type: object
      properties:
        points:
          type: integer
    PicId:
      type: object
      properties:
        pic_id:
          type: integer
        clear_name:
          type: string
    NameRef:
      type: object
      properties:
        id:
          type: string
        cleanedname:
          type: string
        url:
          type: string
          enum:
          - etel
          - recept
    Top300Item:
      type: object
      properties:
        id:
          type: string
          description: '"foodId_unitId"'
        name:
          type: string
        cal:
          type: number
          description: kcal/100 g
      x-note: 'Verified field names: id/name/cal; more columns may be present.'
    GetIdResult:
      type: object
      properties:
        id:
          type: string
    SearchResponse:
      type: object
      description: Full search response (live-verified). results1 = matches already eaten today (always
        empty anonymously); results2 = food matches.
      properties:
        rownum1:
          type: number
        total1:
          type: string
        results1:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
        total2:
          type: string
          description: total matching foods
        results2:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
        usdaLinks_arr:
          type: object
          additionalProperties:
            type: string
          description: food_id -> usda import note
        rec_usda_empty_arr:
          type: array
        food_id_2_barcode_pic:
          type: array
        food_id_2_fav:
          type: object
          description: food_id -> favourite marker
        food_id_2_pic_id:
          type: object
          additionalProperties:
            type: object
            properties:
              pic_id:
                type: number
              clear_name:
                type: string
        prices:
          type: object
          additionalProperties:
            type: number
          description: food_id -> unit price
        discounts:
          type: array
    FavMealItem:
      type: object
      properties:
        nId:
          type: integer
          description: Favourite-meal id.
        cName:
          type: string
        nWeight:
          type: number
          description: Grams of the stored meal.
        cal:
          type: number
        nProtein:
          type: number
        nCarbo:
          type: number
        nFat:
          type: number
        nTod:
          type: integer
          description: Meal slot of the stored meal.
        dDate:
          type: string
          description: Date the meal was captured from (YYYY-MM-DD).
    SearchResultItem:
      type: object
      description: One row of a food search result (live-verified 2026-10-03, post-outage build).
      properties:
        id:
          type: string
          description: foodunit composite id '<obj_id>_<unit>'
        eaten_food:
          type: number
          description: diary-entry id if this food was eaten today, else 0
        food_id:
          type: string
        obj_id:
          type: string
        kuktalink:
          type: string
          description: CSS class/href template slot for the food-page link
        kuktapic:
          type: string
        kuktatitle:
          type: string
        votedpic:
          type: string
        votedpictitle:
          type: string
        name:
          type: string
        cDesc:
          type: string
          description: community-food description
        pic:
          type: string
        pictitle:
          type: string
        pictrash:
          type: string
        pictrashtitle:
          type: string
        piece:
          type: string
          description: labelled unit, e.g. '100 g'
        weight:
          type: string
        cal:
          type: string
          description: formatted kcal for the unit, e.g. '143 kcal'
        protein:
          type: string
        carbo:
          type: string
        fat:
          type: string
        link:
          type: string
        linkname:
          type: string
        link2:
          type: string
        unvoteddelvotedpic:
          type: string
        unvoteddelvotedpictitle:
          type: string
        datasheetlink:
          type: string
          description: full food-page URL
        kcal_and_unit:
          type: string
          description: e.g. 'kcal/100g'
    FoodInfo:
      type: object
      properties:
        boxes:
          type: array
          description: '4 boxes: 1 = macros, 2 = minerals (Ásványok), 3 = vitamins (Vitaminok), 4 = fats
            (Zsírok).'
          items:
            $ref: '#/components/schemas/FoodInfoBox'
        img1:
          type: string
        img2:
          type: string
        rating_block_obj:
          type: object
        fds_data:
          type: object
    FoodInfoBox:
      type: object
      properties:
        box_id:
          type: integer
        title:
          type: string
        lines:
          type: array
          items:
            $ref: '#/components/schemas/FoodInfoLine'
    FoodInfoLine:
      type: object
      properties:
        prop_id:
          type: integer
          description: Nutrient property id (see the nutrient table in the report).
        prop_id_txt:
          type: string
          description: Hungarian display name, sometimes with the English name in parentheses.
        unit:
          type: string
          description: kcal / g / mg / µg / IU / %.
        prop_val:
          type: string
          description: Value per 100 g (or per unit for non-gram foods).
        from_usda:
          type: string
          description: '"1" when the value came from the USDA import.'
    PieData:
      type: array
      items:
        type: array
        minItems: 2
        maxItems: 2
        items:
          type: string
          x-note: key / numeric string
      x-note: 'Verified example (PCC_pie2, gui=42, id=1147_0): [["MAIN_feherje","13.5"],["MAIN_szenhidrat","0.6"],["MAIN_zsir","12"]]
        — values are kcal, not percentages.'
    DiaryDay:
      type: object
      x-note: 'Loosely typed: meal sections (tod 0-5) with fu_id entries, totals, sport section, water,
        etc. See the report for a rendered example.'
    DiaryEntry:
      type: object
      description: 'One diary ENTRY row from getfoods (return_json=1). Verified live 2026-10-04. Mixed
        typing is real: numeric-looking fields mostly arrive as STRINGS (nID, nCalorie, nQuantity, nDayoftimeRef...)
        while nProtein/nFat/nCarbo and the boolean flags bSum/edit_able are true numbers. unitDisplayName
        is an i18n key ("UNIT_dkg"), unitDisplayName2 the plain label ("g"). Field names follow the Hungarian
        legacy prefixes (n=number, c=string, b=boolean).'
      properties:
        nID:
          type: string
          description: 'Diary entry (fooduser) id — ARRIVES AS A STRING (verified live: "610620334").
            This is the id delfood takes.'
        nFoodID:
          type: string
          description: 'Underlying food/recipe id — string (verified: "2088").'
        food_id:
          type: string
          description: 'Food id in the "<id>_<synonym>" string form (verified: "2620126").'
        syn_name:
          type: string
          description: Synonym/display name of the food.
        f_name:
          type: string
          description: Food name.
        cName:
          type: string
          description: 'Chosen synonym name shown for the entry (verified: "Mindegy").'
        cleanedname:
          type: string
          description: 'Slug of the food name (verified: "_tojas").'
        cDisplayName:
          type: string
          description: 'Display name of the entry; may carry a leading space (verified: " Tojás"). Trim
            before display.'
        nCalorie:
          type: string
          description: 'Calories (kcal) of the entry — STRING (verified: "28.60").'
        nProtein:
          type: number
          description: 'Protein grams — real number (verified: 2.51).'
        nFat:
          type: number
          description: 'Fat grams — real number (verified: 1.9).'
        nCarbo:
          type: number
          description: 'Carbohydrate grams — real number (verified: 0.14).'
        nQuantity:
          type: string
          description: 'Quantity in the chosen unit — STRING (verified: "2.00").'
        nWeight:
          type: string
          description: 'Per-unit weight — STRING (verified: "10.00").'
        nFoodUnitRef:
          type: string
          description: 'Unit id — STRING (verified: "25" = dkg).'
        unit_id:
          type: string
          description: 'Same value as nFoodUnitRef, as string (verified: "25").'
        unitDisplayName:
          type: string
          description: 'Primary unit as an i18n KEY (verified: "UNIT_dkg") — strip the "UNIT_" prefix
            and lowercase for display.'
        unitDisplayName2:
          type: string
          description: 'Secondary unit as a plain human label (verified: "g").'
        unit_text:
          type: string
          description: 'Combined quantity+unit label (verified: "2 dkg").'
        nDayoftimeRef:
          type: string
          description: 'Meal-of-day slot (1-7) — STRING (verified: "1"). Compare numerically, never strictly.'
        hour_min:
          type: string
          description: Entry time; "0" for freshly added entries, otherwise HH:MM.
        nHoursMinutes:
          type: integer
          description: Entry time encoded as HHMM.
        bRecept:
          type: string
          description: '"1" when the entry is a recipe (verified as string "0").'
        bOriginal:
          type: string
          description: '"1" when the food is the user''s own food (verified as string "0").'
        bSum:
          type: integer
          description: 0 marks an entry row; the interleaved statistics row carries 1 (real number).
        edit_able:
          type: integer
          description: 1 when the entry can be edited by the current user (real number).
        nSynonymFoodRef:
          type: string
          description: Synonym id when the entry uses one; null otherwise.
          nullable: true
        sumWeight:
          type: string
          description: 'Total weight in grams — STRING (verified: "20.0000").'
        url:
          type: string
          description: 'Relative link slug for the food type (verified: "etel").'
        url_id:
          type: string
          description: 'Food-unit id used in links (verified: "2088_0").'
        fav_id:
          type: string
          description: Favourite id when the food is a favourite; null otherwise.
          nullable: true
        fb_table_id:
          type: string
          description: Favourite-button table id; null otherwise.
          nullable: true
        food_nCreated:
          type: string
          description: Creation timestamp of the food, when present; null otherwise.
          nullable: true
    MealStat:
      type: object
      description: 'Per-meal statistics row from getfoods, interleaved with DiaryEntry rows. Distinguish
        by bSum === 1 (or by nID === 0). Verified live 2026-10-04: unlike entry rows, its totals are true
        numbers while nDayoftimeRef is still the string "1".'
      properties:
        bSum:
          type: integer
          description: '1 marks a statistics row (verified: 1).'
        nDayoftimeRef:
          type: string
          description: 'Meal slot the stats belong to — STRING (verified: "1"), same as entry rows.'
        nCalorie:
          type: number
          description: 'Meal total kcal — real number (verified: 28.6), unlike entry rows.'
        nProtein:
          type: number
          description: Meal total protein — real number.
        nCarbo:
          type: number
          description: Meal total carbohydrate — real number.
        nFat:
          type: number
          description: Meal total fat — real number.
        nID:
          type: integer
          description: Always 0 on a statistics row.
        nQuantity:
          type: integer
          description: Always 0 on a statistics row.
    DiaryDayJson:
      type: object return_json=1 — the full diary day as the mobile client consumes it.
      properties:
        results:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/DiaryEntry'
            - $ref: '#/components/schemas/MealStat'
          description: Diary entries and per-meal statistics rows interleaved in display order.
        rfoodsum:
          type: number
          description: Day total kcal.
        rfoodsumProtein:
          type: number
          description: Day total protein.
        rfoodsumCarbo:
          type: number
          description: Day total carbohydrate.
        rfoodsumFat:
          type: number
          description: Day total fat.
        favbuts:
          description: Favourite buttons payload for the entry dialog.
          oneOf:
          - type: array
          - type: object
        intermittent:
          type: object
          description: 'Intermittent-fasting tracker: time of the last meal.'
          properties:
            year:
              type: integer
            month:
              type: integer
            day:
              type: integer
            nHoursMinutes:
              type: integer
              description: Last meal time as HHMM.
        prices:
          description: Price rows (Ft) when the user has price tracking enabled.
          oneOf:
          - type: array
          - type: object
        obj_id_2_pic_id:
          type: object
          description: Map of food object id to picture id.
        food_id_2_barcode:
          type: object
          description: Map of food id to barcode.
        seconds_to_midnight:
          type: integer
          description: Server hint for when the day rolls over.
    DailySettings:
      type: object
      description: Response of getdaily. type=1 means not-logged-in / session timeout, (requires a logged-in
        session) carrying an error message.
      properties:
        type:
          type: integer
          description: 0 when logged in and data valid, 1 on auth failure.
        error:
          type: string
          description: Error message when type=1.
        boxdailySet:
          type: string
          description: Daily-limit mode ('0' off, '1' kcal limit, '2' percentage).
        txtdailyquan:
          type: string
          description: The daily kcal limit value.
        boxdailyType:
          type: integer
          description: Daily-frame chart type (2-5 when premium).
    IsFav:
      type: object
      properties:
        isfav:
          type: string
          description: '''1'' when the food is a favourite (last used quantity/unit then present).'
        nFoodUnitRef:
          type: integer
          description: Unit id to preselect.
        nQuantity:
          type: number
          description: Quantity to prefill.
    ExpropSettings:
      type: object
      description: Response of get_exprop_settings — the 'diary recommendation' dialog (requires a logged-in
        session) (requires a logged-in session) state.
      properties:
        prop_values_arr:
          type: array
          description: List of extra-nutrient properties available for the recommendation dialog.
        exprop_settings:
          type: array
          description: Currently selected property indices for the user.
  responses:
    SessionError:
      content:
        application/json:
          schema:
            type: object
            properties:
              type:
                const: '1'
              error:
                type: string
            description: Not logged in / session expired.
          examples:
            not_logged_in:
              value:
                type: '1'
                error: Nem vagy bejelentkezve!
    GuardOrTimeout:
      content:
        text/plain:
          schema:
            type: string
          examples:
            timeout:
              value: '###TIMEOUT### — the PHP session expired; re-visit any page to get a new session.'
            guard:
              value: die_with_text arjrjkrk — anti-abuse guard; see the security notes in the API description.
paths:
  /getsport.php:
    get:
      operationId: search_sports
      tags:
      - Search
      summary: Search sport activities (the sport search box autocomplete).
      description: 'Live-verified 2026-10-03: response envelope is {results:[], weight, total}. Item shape
        (13 fields): id ("548_0"), name, cDesc, pic, pictitle, pictrash, pictrashtitle, type, piece (e.g.
        "1 óra"), weight, cal (e.g. "627 kcal"), link, linkname. NOTE: the query is ACCENT-SENSITIVE (unlike
        /getfood.php): q=fut returns 0 hits, q=futás returns hits. Params q, p, s, date (the frontend
        always sends date in yyyy.mm.dd dot format).'
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Search term (accent-sensitive, unlike food search).
      - name: p
        in: query
        required: false
        schema:
          type: integer
          default: 1
        description: 1-based page number.
      - name: s
        in: query
        required: false
        schema:
          type: integer
          default: 10
        description: Page size (frontend sends Mbs_flist_max_elements).
      - name: date
        in: query
        required: false
        schema:
          type: string
        description: Diary date, dot format (e.g. 2026.10.03). Probably used to compute calories for the
          user's weight.
      security:
      - cookieAuth: []
      responses:
        '200':
          description: See API description for response conventions.
          content:
            application/json: {}
  /getfood.php:
    get:
      operationId: search_foods
      tags:
      - Search
      summary: Search foods and recipes (the site autocomplete + result list).
      description: 'The main search engine of the site. Called by the diary search box (desktop + mobile)
        with paging. The response mixes two result sets: `results1` = your favourite meals matching the
        query, `results2` = all foods/recipes (both approved and "grey" public ones; see all_public_food).
        Verified live 2026-10-03: q=tojas returns 16 hits, q="kinder bueno" returns 1 hit.'
      parameters:
      - name: q
        in: query
